wom.whatIsWoM=Qu'est-ce que le WoM ?
wom.whatIsWoM.paragraph1=AKA World of Meeds, le WoM permet aux travailleurs et aux détenteurs de capitaux de développer des stratégies génératrices de valeur.
wom.whatIsWoM.paragraph2=Meeds introduit le WoM, un système de centres de travail basés sur le Web qui promeut la transparence et l'équité grâce à des incitations équitables et à la reconnaissance objective.
wom.whatIsWoM.paragraph3=Pour plus d'informations, veuillez visiter {0}notre site Internet{1}
wom.setup.subtitle1=Listez votre plateforme dans le {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=Qu'est-ce que l'explorateur de Hubs ?
wom.setup.subtitle1.paragraph1=L'explorateur de Hubs présente toutes les plates-formes liées au WoM.
wom.setup.subtitle1.paragraph2=Accédez via {0}ce site{1}
wom.setup.subtitle1.paragraph3=Ceci vous offre une méthode simple pour mettre en valeur votre plateforme d'engagement sur un site web public, vous permettant de commercialiser votre organisation et d’illustrer la façon dont vous embarquez et engagez votre communauté et ses membres.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Pour plus d'informations, veuillez visiter {0}notre site Internet{1}
