wom.whatIsWoM=Mikä on WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, WoM tarjoaa lisäarvoa tuottavia strategioita sekä työntekijöille että pääoman omistajille.
wom.whatIsWoM.paragraph2=Meeds esittelee WoM:n, joka on web3-pohjaisten työkeskittymien järjestelmä, joka edistää avoimuutta ja oikeudenmukaisuutta oikeudenmukaisten kannustimien ja objektiivisen tunnustamisen avulla.
