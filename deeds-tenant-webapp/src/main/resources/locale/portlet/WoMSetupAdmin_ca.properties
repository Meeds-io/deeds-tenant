wom.whatIsWoM=Què és el WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, el WoM permet estratègies de generació de valor tant per als treballadors com per als propietaris de capital.
wom.whatIsWoM.paragraph2=Meeds presenta el WoM, un sistema de centres de treball basats en web3 que promou la transparència i l'equitat mitjançant incentius justos i reconeixement objectiu.
wom.whatIsWoM.paragraph3=Per obtenir més informació, visiteu el {0}nostre lloc web{1}
wom.setup.subtitle1=Enumereu la vostra plataforma a l'{0}Explorador de concentradors{1}
wom.setup.subtitle1.tooltip=Què és Hub Explorer?
wom.setup.subtitle1.paragraph1=El Hub Explorer mostra totes les plataformes vinculades al WoM.
wom.setup.subtitle1.paragraph2=Accediu-hi a través del {0}nostre lloc web{1}
wom.setup.subtitle1.paragraph3=Això us ofereix un mètode senzill per presentar la vostra plataforma de participació en un lloc web públic, que us permet comercialitzar la vostra organització i il·lustrar com us integreu i comprometeu la vostra comunitat i els seus membres.
wom.setup.subtitle2=i uneix-te a l'{0}encunyació de la implicació de l'usuari{1}
wom.setup.subtitle2.tooltip=Què és l'encunyació de la participació de l'usuari?
wom.setup.subtitle2.paragraph1=Meeds DAO té com a objectiu recompensar la participació dels usuaris de cada Hub que s'executa al WoM.
wom.setup.subtitle2.paragraph2=Per obtenir més informació, visiteu el {0}nostre lloc web{1}
