wom.whatIsWoM=WoM چیست?
wom.whatIsWoM.paragraph1=AKA World of Meeds، WoM استراتژی های تولید ارزش را هم برای کارگران و هم برای صاحبان سرمایه امکان پذیر می کند.
wom.whatIsWoM.paragraph2=Meeds WoM را معرفی می کند، سیستمی از مراکز کاری مبتنی بر وب 3 که شفافیت و برابری را از طریق مشوق های منصفانه و شناسایی هدف ترویج می کند.
wom.whatIsWoM.paragraph3=برای اطلاعات بیشتر، لطفاً از {0}وب سایت ما{1} دیدن کنید
wom.setup.subtitle1=پلتفرم خود را در {0}Hub Explorer{1} فهرست کنید
wom.setup.subtitle1.tooltip=Hub Explorer چیست؟
wom.setup.subtitle1.paragraph1=Hub Explorer هر پلتفرم مرتبط با WoM را به نمایش می گذارد.
wom.setup.subtitle1.paragraph2=از طریق {0}وب سایت ما{1} به آن دسترسی داشته باشید
wom.setup.subtitle1.paragraph3=این روش ساده ای را به شما ارائه می دهد تا پلتفرم تعامل خود را در یک وب سایت عمومی نشان دهید، به شما این امکان را می دهد که سازمان خود را بازاریابی کنید و نحوه ورود و تعامل با جامعه و اعضای آن را به شما نشان دهید.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=برای اطلاعات بیشتر، لطفاً از {0}وب سایت ما{1} دیدن کنید
