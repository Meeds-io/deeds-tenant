wom.setup.subtitle1.paragraph3=To vám ponúka jednoduchý spôsob, ako prezentovať vašu platformu na zapojenie sa do verejnej webovej stránky, čo vám umožní propagovať vašu organizáciu a ilustrovať, ako zapájate a zapájate svoju komunitu a jej členov.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
