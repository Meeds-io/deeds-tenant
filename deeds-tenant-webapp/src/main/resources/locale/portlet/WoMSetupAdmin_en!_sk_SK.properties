wom.whatIsWoM=Čo je WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, WoM umožňuje stratégie generujúce hodnoty pre pracovníkov aj vlastníkov kapitálu.
wom.whatIsWoM.paragraph2=Meeds predstavuje WoM, systém pracovných centier založených na webe3, ktorý podporuje transparentnosť a spravodlivosť prostredníctvom spravodlivých stimulov a objektívneho uznania.
