wom.whatIsWoM=Che cos'è il WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, il WoM consente strategie di creazione di valore sia per i lavoratori che per i proprietari di capitali.
wom.whatIsWoM.paragraph2=Meeds introduce il WoM, un sistema di hub di lavoro basati sul web 3 che promuove la trasparenza e l'equità attraverso incentivi equi e il riconoscimento oggettivo.
wom.whatIsWoM.paragraph3=Per ulteriori informazioni, visiti {0}il nostro sito{1}
wom.setup.subtitle1=Elenchi la Sua piattaforma in {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=Cos'è l'Hub Explorer?
wom.setup.subtitle1.paragraph1=L'Hub Explorer mette in mostra ogni piattaforma collegata al WoM.
wom.setup.subtitle1.paragraph2=Acceda tramite {0}il nostro sito{1}
wom.setup.subtitle1.paragraph3=Questo Le offre un metodo semplice per mostrare la Sua piattaforma di engagement su un sito web pubblico, Le permette di promuovere la Sua organizzazione e di illustrare come accoglie e coinvolge la Sua comunità e i suoi membri.
wom.setup.subtitle2=e guadagni token MEED tramite il programma {0}Meeds Rewards{1}.
wom.setup.subtitle2.tooltip=Scopra di più sul programma Meeds Rewards
wom.setup.subtitle2.paragraph1=Meeds premia il coinvolgimento della Sua community. Il Suo Hub può guadagnare token MEED ogni settimana, in base al suo punteggio di coinvolgimento. Per iniziare, associ questo Hub a un DEED NFT.
wom.setup.subtitle2.paragraph2=Per ulteriori informazioni, visiti {0}il nostro sito{1}
wom.connectToWoM=Connettiti a WoM
wom.connect.parapgraph1=Si unisca all'ecosistema MEED ed entri a far parte della rivoluzione dell'impegno.
wom.connect.parapgraph2=Per farlo, è necessario avere un NFT DEED o un contratto di leasing.
wom.connect.parapgraph3=Una volta pronto, connetta il Suo portafoglio e proceda per associare la Sua piattaforma al WoM.
