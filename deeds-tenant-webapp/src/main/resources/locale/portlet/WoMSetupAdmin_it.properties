wom.whatIsWoM=Che cos'è il WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, il WoM consente strategie di creazione di valore sia per i lavoratori che per i proprietari di capitali.
wom.whatIsWoM.paragraph2=Meeds introduce il WoM, un sistema di hub di lavoro basati sul web 3 che promuove la trasparenza e l'equità attraverso incentivi equi e il riconoscimento oggettivo.
wom.whatIsWoM.paragraph3=Per ulteriori informazioni, visita {0}il nostro sito{1}
wom.setup.subtitle1=Elenca la tua piattaforma nell'Esploratore {0}Hub{1}
wom.setup.subtitle1.tooltip=Cos'è l'Hub Explorer?
wom.setup.subtitle1.paragraph1=L'Hub Explorer mette in mostra ogni piattaforma collegata al WoM.
wom.setup.subtitle1.paragraph2=Accedi tramite {0}il nostro sito{1}
wom.setup.subtitle1.paragraph3=Questo ti offre un metodo semplice per mostrare la tua piattaforma di engagement su un sito web pubblico, ti permette di commercializzare la tua organizzazione e illustrare come ti trovi a bordo e coinvolgi la tua comunità e i suoi membri.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Per ulteriori informazioni, visita {0}il nostro sito{1}
wom.connectToWoM=Connettiti a WoM
wom.connect.parapgraph1=Unisciti all'ecosistema MEED ed entra a far parte della rivoluzione dell'impegno.
wom.connect.parapgraph2=Per farlo, è necessario avere un NFT DEED o un contratto di leasing.
wom.connect.parapgraph3=Una volta pronto, connetti il tuo portafoglio e procedi per associare la tua piattaforma al WoM.
