wom.whatIsWoM=Ano ang WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, ang WoM ay nagbibigay-daan sa mga diskarte sa pagbuo ng halaga para sa parehong mga manggagawa at may-ari ng kapital.
wom.whatIsWoM.paragraph2=Ipinakilala ng Meeds ang WoM, isang sistema ng mga hub ng trabaho na nakabatay sa web3 na nagtataguyod ng transparency at equity sa pamamagitan ng patas na mga insentibo at layunin na pagkilala.
wom.whatIsWoM.paragraph3=Para sa higit pang impormasyon, pakibisita ang {0}aming Website{1}
wom.setup.subtitle1=Ilista ang iyong platform sa {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=Ano ang Hub Explorer?
wom.setup.subtitle1.paragraph1=Ang Hub Explorer ay nagpapakita ng bawat platform na naka-link sa WoM.
wom.setup.subtitle1.paragraph2=I-access ito sa pamamagitan ng {0}aming Website{1}
wom.setup.subtitle1.paragraph3=Nag-aalok ito sa iyo ng isang simpleng paraan upang itampok ang iyong platform ng pakikipag-ugnayan sa isang pampublikong website, na nagbibigay-daan sa iyong i-market ang iyong organisasyon at ilarawan kung paano ka sumasakay at nakikipag-ugnayan sa iyong komunidad at sa mga miyembro nito.
wom.setup.subtitle2=at sumali sa {0}User Engagement Minting{1}
wom.setup.subtitle2.tooltip=Ano ang User Engagement Minting?
wom.setup.subtitle2.paragraph1=Nilalayon ng Meeds DAO na gantimpalaan ang pakikipag-ugnayan ng user sa bawat Hub na tumatakbo sa WoM.
wom.setup.subtitle2.paragraph2=Para sa higit pang impormasyon, pakibisita ang {0}aming Website{1}
