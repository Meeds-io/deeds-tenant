wom.setup.subtitle1.paragraph2={0}당사 웹사이트{1}를 통해 접속하세요.
wom.setup.subtitle1.paragraph3=이 방법을 사용하면 공개 웹사이트에 참여 플랫폼을 쉽게 소개하고, 조직을 마케팅하고 커뮤니티와 구성원을 참여시키는 방법을 보여줄 수 있습니다.
