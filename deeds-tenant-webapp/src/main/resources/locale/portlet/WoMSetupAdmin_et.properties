wom.whatIsWoM=Mis on WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, WoM võimaldab väärtust loovaid strateegiaid nii töötajatele kui ka kapitaliomanikele.
wom.whatIsWoM.paragraph2=Meeds tutvustab WoM-i, veebi3-põhiste töökeskuste süsteemi, mis edendab läbipaistvust ja võrdsust õiglaste stiimulite ja objektiivse tunnustamise kaudu.
wom.whatIsWoM.paragraph3=Lisateabe saamiseks külastage {0}meie veebisaiti{1}
wom.setup.subtitle1=Loetlege oma platvorm {0}Hub Exploreris{1}
wom.setup.subtitle1.tooltip=Mis on Hub Explorer?
wom.setup.subtitle1.paragraph1=Hub Explorer esitleb kõiki WoM-iga seotud platvorme.
wom.setup.subtitle1.paragraph2=Juurdepääs sellele {0}meie veebisaidi{1} kaudu
wom.setup.subtitle1.paragraph3=See pakub teile lihtsat meetodit oma kaasamisplatvormi avalikul veebisaidil kuvamiseks, mis võimaldab teil oma organisatsiooni turundada ja illustreerida, kuidas te oma kogukonda ja selle liikmeid kaasate ja kaasate.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Lisateabe saamiseks külastage {0}meie veebisaiti{1}
