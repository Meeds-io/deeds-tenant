wom.whatIsWoM.paragraph2=Meeds, adil teşvikler ve objektif takdir yoluyla şeffaflığı ve eşitliği destekleyen, web3 tabanlı çalışma Hub'larından oluşan bir sistem olan WoM'u tanıtıyor.
