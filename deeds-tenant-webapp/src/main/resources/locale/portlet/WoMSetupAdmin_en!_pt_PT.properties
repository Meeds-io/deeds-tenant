wom.whatIsWoM=O que é a WoM?
wom.whatIsWoM.paragraph1=A AKA World of Meeds, o WoM permite estratégias geradoras de valor, tanto para trabalhadores quanto para proprietários de capitais.
wom.whatIsWoM.paragraph2=As medidas introduzem o WoM, um sistema de centros de trabalho baseados na web que promove a transparência e a equidade através de incentivos justos e reconhecimento objetivo.
wom.whatIsWoM.paragraph3=Para mais informações, por favor, visite {0}nosso site{1}
wom.setup.subtitle1=Liste sua plataforma no {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=O que é o Explorador do Hub?
wom.setup.subtitle1.paragraph1=O Hub Explorer mostra todas as plataformas ligadas ao WoM.
wom.setup.subtitle1.paragraph2=Acessá-lo através de {0}nosso site{1}
wom.setup.subtitle1.paragraph3=Isto oferece a você um método simples para destacar a sua plataforma de envolvimento em um site público, permitindo que você comercialize sua organização e ilustre como você integra e envolva sua comunidade e seus membros.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Para mais informações, por favor, visite {0}nosso site{1}
