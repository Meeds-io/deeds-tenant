wom.whatIsWoM=Що таке WoM?
wom.whatIsWoM.paragraph1=WoM також відомий як World of Meeds і дає змогу створювати стратегії створення цінності як для працівників, так і для власників капіталу.
wom.whatIsWoM.paragraph2=Мідс представляє WoM, систему робочих центрів на основі web3, яка сприяє прозорості та справедливості через справедливі стимули та об’єктивне визнання.
wom.whatIsWoM.paragraph3=Для отримання додаткової інформації відвідайте {0}наш веб-сайт{1}
wom.setup.subtitle1=Список ваших платформ в {0}концентрувальнику{1}
wom.setup.subtitle1.tooltip=Що таке Хаб Досліджувач?
wom.setup.subtitle1.paragraph1=Ступичний дослідник показує кожну платформу, пов'язану з WoM.
wom.setup.subtitle1.paragraph2=Доступ до нього через {0}наш веб-сайт{1}
wom.setup.subtitle1.paragraph3=Це пропонує вам простий метод для роботи вашої платформи залучення на публічному сайті, дозволяючи вам роздавати свою організацію та ілюструвати, як ви на борту, залучати своє співтовариство та його членів.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Для отримання додаткової інформації відвідайте {0}наш веб-сайт{1}
