wom.whatIsWoM=Wat is de WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, het WoM maakt waardegenererende strategieën mogelijk, zowel voor werknemers als voor kapitaalbezitters.
wom.whatIsWoM.paragraph2=Gemeens wordt de WoM geïntroduceerd, een systeem van web3-gebaseerde werkknooppunten dat transparantie en rechtvaardigheid bevordert door middel van eerlijke prikkels en objectieve erkenning.
