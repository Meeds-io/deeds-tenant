wom.setup.subtitle1.tooltip=Wat is de Hub Explorer?
wom.setup.subtitle1.paragraph1=De Hub Explorer laat elk platform zien dat gekoppeld is aan de WoM.
wom.setup.subtitle1.paragraph2=Toegang tot {0}onze Website{1}
wom.setup.subtitle1.paragraph3=Dit biedt je een eenvoudige methode om je engagement platform op een publieke website te laten zien laat je toe je organisatie te verhandelen en laat zien hoe je aan boord bent en hoe je je gemeenschap en haar leden erbij betrekt.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
