wom.setup.subtitle2.paragraph1=Meeds odměňuje zapojení vaší komunity. Váš Hub může každý týden získávat tokeny MEED na základě svého skóre zapojení. Začněte tím, že tento Hub přiřadíte k NFT DEED.
