wom.setup.subtitle1.paragraph3=Nabízí vám jednoduchý způsob uvedení vaší platformy pro zapojení na veřejné webové stránce, umožňuje vám nabízet svou organizaci a ilustrující, jak jste zapojeni do své komunity a jejích členů.
