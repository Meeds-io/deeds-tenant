wom.whatIsWoM=Co je WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, WoM umožňuje strategie vytvářející hodnoty jak pro pracovníky, tak pro vlastníky kapitálu.
wom.whatIsWoM.paragraph2=Meeds zavádí WoM, systém pracovních center založených na webu, který podporuje transparentnost a spravedlnost prostřednictvím spravedlivých pobídek a objektivního uznání.
