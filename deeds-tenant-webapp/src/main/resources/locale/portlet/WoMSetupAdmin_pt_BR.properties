wom.whatIsWoM=O que é o WoM?
wom.whatIsWoM.paragraph1=Também conhecido como Mundo dos Alimentos, o WoM possibilita estratégias de geração de valor tanto para trabalhadores quanto para proprietários de capital.
wom.whatIsWoM.paragraph2=Meeds apresenta o WoM, um sistema de centros de trabalho baseados na web3 que promove transparência e equidade por meio de incentivos justos e reconhecimento objetivo.
wom.whatIsWoM.paragraph3=Para mais informações, visite {0}nosso site{1}
