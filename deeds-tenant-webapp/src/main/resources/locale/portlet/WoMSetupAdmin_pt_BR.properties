wom.setup.subtitle1.tooltip=O que é o Hub Explorer?
wom.setup.subtitle1.paragraph1=O Hub Explorer mostra todas as plataformas vinculadas ao WoM.
wom.setup.subtitle1.paragraph2=Acesse através do {0}nosso site{1}
wom.setup.subtitle1.paragraph3=Isso oferece a você um método simples de apresentar sua plataforma de engajamento em um site público, permitindo que você divulgue sua organização e ilustre como você integra e envolve sua comunidade e seus membros.
wom.setup.subtitle2=e junte-se ao {0}User Engagement Minting{1}
wom.setup.subtitle2.tooltip=O que é o User Engagement Minting?
wom.setup.subtitle2.paragraph1=O Meeds DAO tem como objetivo recompensar o engajamento do usuário de cada Hub em execução no WoM.
wom.setup.subtitle2.paragraph2=Para mais informações, visite {0}nosso site{1}
