wom.whatIsWoM=O que é o WoM?
wom.whatIsWoM.paragraph1=Também conhecido como Mundo dos Alimentos, o WoM possibilita estratégias de geração de valor tanto para trabalhadores quanto para proprietários de capital.
wom.whatIsWoM.paragraph2=Meeds apresenta o WoM, um sistema de centros de trabalho baseados na web3 que promove transparência e equidade por meio de incentivos justos e reconhecimento objetivo.
wom.whatIsWoM.paragraph3=Para mais informações, visite {0}nosso site{1}
wom.setup.subtitle1=Liste sua plataforma no {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=O que é o Hub Explorer?
wom.setup.subtitle1.paragraph1=O Hub Explorer mostra todas as plataformas vinculadas ao WoM.
wom.setup.subtitle1.paragraph2=Acesse através do {0}nosso site{1}
wom.setup.subtitle1.paragraph3=Isso oferece a você um método simples de apresentar sua plataforma de engajamento em um site público, permitindo que você divulgue sua organização e ilustre como você integra e envolve sua comunidade e seus membros.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Para mais informações, visite {0}nosso site{1}
