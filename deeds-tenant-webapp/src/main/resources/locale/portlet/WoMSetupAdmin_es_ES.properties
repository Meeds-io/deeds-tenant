wom.whatIsWoM=¿Qué es la WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, la WoM permite estrategias generadoras de valor tanto para los trabajadores como para los propietarios de capital.
wom.whatIsWoM.paragraph2=Meeds introduce el WoM, un sistema de centros de trabajo basados en la web 3 que promueve la transparencia y la equidad a través de incentivos justos y la lucha objetiva.
wom.whatIsWoM.paragraph3=Para más información, por favor visite {0}nuestro sitio web{1}
wom.setup.subtitle1=Lista de tu plataforma en el {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=¿Qué es el Hub Explorer?
wom.setup.subtitle1.paragraph1=El Hub Explorer muestra todas las plataformas enlazadas al WoM.
wom.setup.subtitle1.paragraph2=Acceda a través de {0}nuestro sitio web{1}
wom.setup.subtitle1.paragraph3=Esto le ofrece un método sencillo para incluir su plataforma de compromiso en un sitio web público, permitiéndole comercializar su organización e ilustrar cómo usted a bordo y involucrar a su comunidad y sus miembros.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Para más información, por favor visite {0}nuestro sitio web{1}
