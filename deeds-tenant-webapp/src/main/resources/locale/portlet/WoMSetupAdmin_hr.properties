wom.whatIsWoM=Što je WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, WoM omogućuje strategije stvaranja vrijednosti i za radnike i za vlasnike kapitala.
wom.whatIsWoM.paragraph2=Meeds predstavlja WoM, sustav radnih središta temeljenih na webu 3, koji promiču transparentnost i jednakost putem poštenih poticaja i objektivnog priznanja.
