wom.whatIsWoM=WoM là gì?
wom.whatIsWoM.paragraph1=AKA World of Meeds, WoM hỗ trợ các chiến lược tạo ra giá trị cho cả người lao động và chủ sở hữu vốn.
wom.whatIsWoM.paragraph2=Meeds giới thiệu WoM, một hệ thống các trung tâm làm việc dựa trên web3 nhằm thúc đẩy tính minh bạch và công bằng thông qua các biện pháp khuyến khích công bằng và sự công nhận khách quan.
wom.whatIsWoM.paragraph3=Để biết thêm thông tin, vui lòng truy cập {0}Trang web của chúng tôi{1}
wom.setup.subtitle1=Liệt kê nền tảng của bạn trong {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=Hub Explorer là gì?
wom.setup.subtitle1.paragraph1=Hub Explorer giới thiệu mọi nền tảng được liên kết với WoM.
wom.setup.subtitle1.paragraph2=Truy cập thông qua {0}Trang web của chúng tôi{1}
wom.setup.subtitle1.paragraph3=Điều này cung cấp cho bạn một phương pháp đơn giản để giới thiệu nền tảng tương tác của bạn trên một trang web công khai, cho phép bạn tiếp thị tổ chức của mình và minh họa cách bạn đưa cộng đồng và các thành viên của mình lên tàu.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Để biết thêm thông tin, vui lòng truy cập {0}Trang web của chúng tôi{1}
