wom.setup.subtitle2.paragraph1=Meeds вознаграждает вовлеченность вашего сообщества. Ваш Hub может еженедельно зарабатывать токены MEED в зависимости от его показателя вовлеченности. Чтобы начать, свяжите этот Hub с DEED NFT.
