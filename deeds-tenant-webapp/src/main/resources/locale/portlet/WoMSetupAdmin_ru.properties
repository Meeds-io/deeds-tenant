wom.setup.subtitle1.paragraph2=Доступ к нему через {0}наш сайт{1}
wom.setup.subtitle1.paragraph3=Это простой способ представить вашу платформу вовлеченности на публичном сайте, продвигать вашу организацию и показывать, как вы привлекаете и вовлекаете ваше сообщество и его участников.
wom.setup.subtitle2=и зарабатывайте токены MEED в рамках программы {0}Meeds Rewards{1}.
