wom.whatIsWoM=Apa itu WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, WoM memungkinkan strategi yang menghasilkan nilai bagi pekerja dan pemilik modal.
wom.whatIsWoM.paragraph2=Meeds memperkenalkan WoM, sebuah sistem pusat kerja berbasis web3 yang mempromosikan transparansi dan kesetaraan melalui insentif yang adil dan pengakuan yang obyektif.
wom.whatIsWoM.paragraph3=Untuk informasi lebih lanjut, silakan kunjungi {0}Situs Web kami{1}
wom.setup.subtitle1=Cantumkan platform Anda di {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=Apa itu Hub Explorer?
wom.setup.subtitle1.paragraph1=Hub Explorer menampilkan setiap platform yang terhubung ke WoM.
wom.setup.subtitle1.paragraph2=Akses melalui {0}Situs Web kami{1}
wom.setup.subtitle1.paragraph3=Ini menawarkan Anda metode sederhana untuk menampilkan platform keterlibatan Anda di situs web publik, memungkinkan Anda memasarkan organisasi Anda dan menggambarkan bagaimana Anda bergabung dan melibatkan komunitas Anda dan anggotanya.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Untuk informasi lebih lanjut, silakan kunjungi {0}Situs Web kami{1}
