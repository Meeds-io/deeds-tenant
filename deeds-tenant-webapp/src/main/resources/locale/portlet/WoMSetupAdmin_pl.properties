wom.whatIsWoM=Czym jest WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, WoM umożliwia tworzenie strategii zarówno dla pracowników, jak i właścicieli kapitału.
wom.whatIsWoM.paragraph2=Oznacza to wprowadzenie WoM, systemu internetowych ośrodków pracy, który promuje przejrzystość i sprawiedliwość poprzez uczciwe zachęty i obiektywne uznawanie.
wom.whatIsWoM.paragraph3=Aby uzyskać więcej informacji, odwiedź stronę {0}naszej strony{1}
wom.setup.subtitle1=Lista swojej platformy w {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=Czym jest eksplorator Hub?
wom.setup.subtitle1.paragraph1=Hub Explorer prezentuje każdą platformę powiązaną z WoM.
wom.setup.subtitle1.paragraph2=Uzyskaj dostęp przez {0}naszą stronę{1}
wom.setup.subtitle1.paragraph3=Oferuje to prostą metodę obsługi platformy zaangażowania na publicznej stronie internetowej, pozwalając Ci na wprowadzanie do obrotu swojej organizacji i ilustrację, w jaki sposób jesteś na pokładzie i angażujesz swoją społeczność i jej członków.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Aby uzyskać więcej informacji, odwiedź stronę {0}naszej strony{1}
