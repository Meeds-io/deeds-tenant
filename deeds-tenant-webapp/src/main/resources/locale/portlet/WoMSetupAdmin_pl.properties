wom.whatIsWoM=Czym jest WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, WoM umożliwia tworzenie strategii zarówno dla pracowników, jak i właścicieli kapitału.
wom.whatIsWoM.paragraph2=Oznacza to wprowadzenie WoM, systemu internetowych ośrodków pracy, który promuje przejrzystość i sprawiedliwość poprzez uczciwe zachęty i obiektywne uznawanie.
wom.whatIsWoM.paragraph3=Aby uzyskać więcej informacji, odwiedź stronę {0}naszej strony{1}
wom.setup.subtitle1=Lista swojej platformy w {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=Czym jest eksplorator Hub?
wom.setup.subtitle1.paragraph1=Hub Explorer prezentuje każdą platformę powiązaną z WoM.
wom.setup.subtitle1.paragraph2=Uzyskaj dostęp przez {0}naszą stronę{1}
wom.setup.subtitle1.paragraph3=To prosty sposób na zaprezentowanie platformy zaangażowania na publicznej stronie internetowej, promocję organizacji i pokazanie, jak wdrażana i angażowana jest społeczność i jej członkowie.
wom.setup.subtitle2=i zdobywaj tokeny MEED w ramach programu {0}Meeds Rewards{1}.
wom.setup.subtitle2.tooltip=Dowiedz się więcej o programie Meeds Rewards
wom.setup.subtitle2.paragraph1=Meeds nagradza zaangażowanie społeczności. Hub może co tydzień zdobywać tokeny MEED na podstawie swojego wyniku zaangażowania. Aby rozpocząć, należy powiązać ten Hub z NFT DEED.
