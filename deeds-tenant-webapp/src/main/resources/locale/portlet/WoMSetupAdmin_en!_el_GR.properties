wom.whatIsWoM=Τι είναι το WoM?
wom.whatIsWoM.paragraph1=Το AKA World of Meeds, το WoM επιτρέπει στρατηγικές παραγωγής αξίας τόσο για τους εργαζόμενους όσο και για τους ιδιοκτήτες κεφαλαίων.
wom.whatIsWoM.paragraph2=Ο Meeds εισάγει το WoM, ένα σύστημα διαδικτυακών κόμβων εργασίας που προωθεί τη διαφάνεια και την ισότητα μέσω δίκαιων κινήτρων και αντικειμενικής αναγνώρισης.
wom.whatIsWoM.paragraph3=Για περισσότερες πληροφορίες, παρακαλώ επισκεφθείτε την {0}ιστοσελίδα μας{1}
wom.setup.subtitle1=Λίστα της πλατφόρμας σας στο {0}Hub Explorer{1}
wom.setup.subtitle1.tooltip=Τι είναι το Hub Explorer?
wom.setup.subtitle1.paragraph1=Το Hub Explorer προβάλλει κάθε πλατφόρμα που συνδέεται με το WoM.
wom.setup.subtitle1.paragraph2=Πρόσβαση μέσω {0}της ιστοσελίδας μας{1}
wom.setup.subtitle1.paragraph3=Αυτό σας προσφέρει μια απλή μέθοδο για να αξιοποιήσετε την πλατφόρμα εμπλοκής σας σε έναν δημόσιο ιστότοπο, σας επιτρέπει να προωθήσετε την οργάνωσή σας και να εξηγήσετε πώς μπορείτε να επιβιβαστείτε και να εμπλέξετε την κοινότητά σας και τα μέλη της.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
wom.setup.subtitle2.paragraph2=Για περισσότερες πληροφορίες, παρακαλώ επισκεφθείτε την {0}ιστοσελίδα μας{1}
wom.connectToWoM=Σύνδεση σε WoM
wom.connect.parapgraph1=Συμμετοχή στο οικοσύστημα MEED και να είναι μέρος της επανάστασης εμπλοκής.
wom.connect.parapgraph2=Για να γίνει αυτό, θα πρέπει να έχετε ένα DEED NFT ή μια σύμβαση μίσθωσης.
wom.connect.parapgraph3=Μόλις είναι έτοιμο, συνδέστε το πορτοφόλι σας και προχωρήστε να συσχετίσετε την πλατφόρμα σας με το WoM.
