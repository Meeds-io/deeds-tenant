wom.whatIsWoM=Ce este WoM?
wom.whatIsWoM.paragraph1=AKA World of Meeds, WoM permite strategii generatoare de valoare atât pentru lucrători, cât şi pentru proprietarii de capital.
wom.whatIsWoM.paragraph2=Meeds introduce programul WoM, un sistem de centre de lucru bazate pe web3 care promovează transparența și echitatea prin stimulente corecte și recunoașterea obiectivă.
