wom.setup.subtitle1.paragraph2=Accesați-l prin intermediul site-ului nostru {0}{1}
wom.setup.subtitle1.paragraph3=Aceasta vă oferă o metodă simplă de a vă prezenta platforma de angajare pe un site public, vă permite să vă comercializați organizația și să ilustrați cum vă aflați la bord și să vă implicați comunitatea și membrii acesteia.
wom.setup.subtitle2=și câștigați tokenuri MEED prin programul {0}Meeds Rewards{1}.
wom.setup.subtitle2.tooltip=Aflați mai multe despre programul Meeds Rewards
wom.setup.subtitle2.paragraph1=Meeds recompensează implicarea comunității dvs. Hubul dvs. poate câștiga săptămânal tokenuri MEED, în funcție de scorul său de implicare. Pentru a începe, asociați acest Hub cu un DEED NFT.
