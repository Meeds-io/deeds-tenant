wom.setup.subtitle1.tooltip=Ce este Hub Explorer?
wom.setup.subtitle1.paragraph1=Hub Explorer prezintă fiecare platformă legată de WoM.
wom.setup.subtitle1.paragraph2=Accesaţi-l prin intermediul site-ului nostru {0}{1}
wom.setup.subtitle1.paragraph3=Aceasta vă oferă o metodă simplă de a vă prezenta platforma de angajare pe un site public, vă permite să vă comercializați organizația și să ilustrați cum vă aflați la bord și să vă implicați comunitatea și membrii acesteia.
wom.setup.subtitle2=and earn MEED tokens through the {0}Meeds Rewards{1} program.
wom.setup.subtitle2.tooltip=Learn more about the Meeds Rewards program
wom.setup.subtitle2.paragraph1=Meeds rewards your community engagement. Your Hub can earn MEED tokens on a weekly basis, based on its engagement score. To get started, associate this Hub with a DEED NFT.
