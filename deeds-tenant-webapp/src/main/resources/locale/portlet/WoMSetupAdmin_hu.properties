wom.whatIsWoM=Mi az a WoM?
wom.whatIsWoM.paragraph1=Más néven World of Meeds, a WoM értékteremtő stratégiákat tesz lehetővé mind a munkavállalók, mind a tőketulajdonosok számára.
wom.whatIsWoM.paragraph2=A Meeds bemutatja a WoM-ot, a web3-alapú munkaközpontok rendszerét, amely méltányos ösztönzőkkel és objektív elismeréssel támogatja az átláthatóságot és a méltányosságot.
